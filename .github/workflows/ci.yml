name: Rust architecture and contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Install disposable database test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo xtask check
      - run: cargo run --locked -p bace-server -- check --config tests/fixtures/config/server.toml
      - run: cargo run --locked -p bace-server -- exercise --ticks 120 --players 2 --bodies 10
  official-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Regenerate fixtures from pinned official source
        run: python3 tools/bace-compat/oracle/generate.py --dotnet dotnet
      - name: Regenerate message, transport and gameplay oracles
        run: |
          python3 tools/bace-compat/oracle/message_generate.py --dotnet dotnet
          python3 tools/bace-compat/oracle/transport_generate.py --dotnet dotnet
          python3 tools/bace-compat/oracle/dat_generate.py --dotnet dotnet
          python3 crates/gameplay/bace-character/oracle/generate.py --dotnet dotnet
          python3 crates/gameplay/bace-quests/oracle/generate.py --dotnet dotnet
      - name: Require checked-in oracle fixtures to match
        run: git diff --exit-code -- tools/bace-compat/fixtures crates/gameplay/bace-character/tests/fixtures crates/gameplay/bace-quests/tests/fixtures
      - uses: actions/checkout@v4
        with:
          repository: ACEmulator/ACE
          ref: 47edade3bd3f6044b676d4eb877c4965c7eda62b
          path: .reference/ACE-pinned
      - name: Verify complete network source inventory
        run: python3 tools/bace-compat/oracle/network_inventory.py --check --source .reference/ACE-pinned
