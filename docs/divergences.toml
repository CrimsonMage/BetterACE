owners = ["bace-simulation", "bace-runtime"]
description = "Pinned ACE Container.Close detaches the currently open viewer and does not rerun Use range; BetterACE requires the exact active actor/account/session binding when adopting a durable corpse Close. Runtime private Close publication and packetless disconnect cleanup apply the same corpse/viewer fence, so a stale or forged session cannot clear another viewer or consume a canonical counter. The bound viewer may still close from elsewhere. This is an authenticated ownership fence, not a claim about ACE's session internals. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/WorldObjects/Container.cs."
status = "stale_session_close_rejection_bound_auto_close_synthetic_projection_and_real_postgresql_save_worker_receipt_regressions; full_live_inspect_adopt_and_visibility_transcript_open"

[[regressions]]
id = "ace-no-corpse-burden-detach-fence"
owners = ["bace-runtime"]
description = "BetterACE retains a corrective NoCorpse burden output while the exact old player replica is disconnecting, then completes it packetlessly after detach rather than sending the old private update to a later login generation. This is a native session ownership fence around the pinned ACE Player_Death.cs burden effect, not a claim about ACE transport reconnect behavior. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/WorldObjects/Player_Death.cs."
status = "old_session_detach_and_new_generation_exclusion_runtime_regression"

[[regressions]]
id = "ace-corpse-open-after-expiry-reservation"
owners = ["bace-simulation"]
description = "Pinned ACE WorldObject_Decay.cs defers corpse decay while its Container.IsOpen; Container.cs handles Use/Open/Close without a durable expiry reservation. BetterACE rejects a new Open after the simulation has reserved that corpse's exact durable expiry ticket or entered Destroying, while an already attached viewer may still Close. This closes the transactional race between an accepted Open and an in-flight expiry write; it is a durability correction, not a claim about ACE's one-second destroy window. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/WorldObjects/WorldObject_Decay.cs and Source/ACE.Server/WorldObjects/Container.cs."
status = "staged_and_destroying_open_gate_owner_regression"

[[regressions]]
id = "ace-no-corpse-inventory-world-ownership"
owners = ["bace-simulation", "bace-runtime", "bace-storage-codec"]
description = "Pinned ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b Creature_Death.cs CreateCorpse/GenerateTreasure appends an existing pack item to NoCorpse world loot, then Landblock.AddWorldObjectInternal notifies nearby players without removing it from the creature Inventory dictionary. The compiled original-source oracle row 1|1|0|1|0 records world:22 while the final Inventory still contains 22. BetterACE intentionally transfers the item to one durable world owner in the same PlayerSaveV6 death checkpoint, preserving its ID, authored DestinationType and copied accepted pose. BetterACE also closes the resulting same-lane pack-slot gap in the durable inventory graph after exact revision and placement checks. The pinned corpse-null branch emits no private removal or slot update for a direct noncontainer pack root; world visibility supplies CreateObject. BetterACE sends the exact committed post-transfer burden value on the canonical private property stream because its corrected owner no longer carries that item. This corrects duplicate ownership and the resulting client burden discrepancy rather than claiming exact ACE packet or in-memory state parity. Other equipped presentation and ordinary world-container Open remain held; one whole ordinary equipped corpse item has an exact V5 private/observer completion. The selected container branch preserves its nested Contain tree with same-placement descendant revision advances in the one exact death operation. Valid-client regression: pinned source oracle row and a committed selected pack-root and sibling-slot V5/visibility receipt. Invalid-state regressions: legacy unknown DestinationType, stale accepted pose, mismatched root or sibling identity/placement/revision, burden overflow, and repeated commit cannot create or publish an extra root."
status = "zero_drop_owner_and_atomic_freezer_tests_pass; pinned_selected_pack_and_exact_slot_receipt_tests_pass; corrective_private_burden_projection_test_passes; selected_container_nested_forest_source_and_postgres_receipt_tests_pass; narrow_equipped_source_packet_order_and_durable_receipt_tests_pass; one_ordinary_equipped_corpse_completion_and_repeat_open_tests_pass; other_equipped_held; actual_dat_sample_spill_placement_and_create_pass; game_client_testing_deferred"

[[regressions]]
id = "ace-initial-login-portal-override-order"
owners = ["bace-simulation", "bace-runtime"]
description = "Pinned ACE GameActionLoginComplete calls OnTeleportComplete, marks FirstEnterWorldDone, then sends property updates and Bool68 overrides once. Landblock readiness can defer the teleport completion after that property update. BetterACE retains the initial materialization until the exact accepted ClientReady receipt and emits Bool68 in its reliable materialization batch only once per entered character binding. The markers are cleared when that binding leaves the authenticated session. This fences the accepted portal view and prevents a duplicate initial completion from repeating the override; it deliberately fixes an out-of-order readiness window rather than claiming identical ACE packet timing. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/Network/GameAction/Actions/GameActionLoginComplete.cs and Player_Location.cs."
status = "connected_out_of_order_and_duplicate_initial_materialization_tests; game_client_testing_deferred"

[[regressions]]
id = "ace-vendor-buy-total-overflow"
owners = ["bace-economy"]
description = "Pinned ACE vendor default Buy pricing multiplies stack unit value, applies the vendor buy rate and a minimum price of one, then accumulates the total in an unchecked unsigned integer. BetterACE's bounded quote preserves the positive source arithmetic and request/stack order but rejects a total that would overflow the supported durable currency amount. This prevents a crafted oversized request from wrapping its price before the still-unsupported live Buy transaction. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/WorldObjects/Vendor.cs and Player_Commerce.cs."
status = "default_buy_quote_bounds_and_overflow_regressions_pass; live_buy_sell_unsupported"

[[regressions]]
id = "ace-staff-ban-durable-audit-order"
owners = ["bace-admin", "bace-gameplay-api", "bace-simulation", "bace-runtime", "bace-persistence", "bace-db-postgres"]
description = "Pinned ACE SentinelCommands handles @ban/@unban with database mutation, private results, online boot and Audit broadcasts through its live command flow. BetterACE gates the private result and exact-generation AccountBoot behind a revision-fenced durable ban receipt and one correlated authoritative in-game Audit acceptance. This changes relative output timing so a failed or uncertain write cannot report success or boot a replacement session. If the issuer detaches before post-commit Audit admission, the committed phase remains retained with failure rather than fabricating Audit or success. BetterACE's separate non-durable external Audit feed has no pinned ACE counterpart; its bounded publisher now reserves capacity before assigning sequence, retains Full for retry, and surfaces Closed as a recoverable degraded state. Source: official ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b, Source/ACE.Server/Command/Handlers/SentinelCommands.cs."
status = "real_postgres_ban_replay_runtime_audit_generation_disconnect_and_feed_pressure_recovery_tests_pass; stock_client_testing_deferred"
