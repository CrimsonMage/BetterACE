[[regressions]]
id = "gdle-player-emote-double-mana"
owners = ["bace-simulation"]
description = "Pinned GDLE 353cbab52ef7da2b7063bc3e3f008461d8531693 SpellcastingManager.cpp CreatureBeginCast (2949-2998) debits base mana before motion; LaunchSpellEffect (858-930) checks actual AsPlayer and uses_mana, so a player-owned noninstant emote can pay again or fizzle after prepayment. SpellCastData has no IsCreatureCast guard at this pin. BetterACE intentionally applies release mana conversion/fizzle/cost only to explicit Player cast origin, preserving one up-front base charge when AIUsesMana is enabled and no charge when disabled for Monster/noninstant Emote origins regardless of actor subtype. The disabled player-emote release charge is also intentionally removed; the oracle records it, while connected owner comparisons cover enabled mana. This is a defect correction under ARCHITECTURE.md BASE-01, not a claim of matching that GDLE edge case. The original-method creature_mana oracle retains the double debit as discrepancy evidence; synthetic motion callback tests cover real NPCs, player emotes, exhausted prepaid pools and unchanged ordinary-player release costs."
