description = "Pinned WorldObject_Magic stores equipment mana accumulator/warning only transiently; Player_Tick delays exhausted-item spell removal by two seconds. Durable mana zero and absent IsAffecting may therefore survive a crash before that transient removal. BetterACE reconstructs an immediate bounded removal only for matching known exhausted item-cast entries before initial entry/capture, without replaying a warning or touching unrelated buffs. Live routine and correlated valuable saves retain the original owner obligation; logout waits for it. This explicitly hardens loss of ACE's transient action without inventing a durable timer schema."
