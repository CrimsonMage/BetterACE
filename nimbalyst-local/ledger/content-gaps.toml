# P0-K content gap inventory (read-only). For each ACE world-database content category: does BACE carry it
# from the pinned SQL through bace-import, native TOML, bace-content-tools compile (.bace namespace), the frozen
# bace-content DTO, bace-runtime preparation, to a gameplay consumer?
#
# Pins: ACE 47edade3bd3f6044b676d4eb877c4965c7eda62b (Source/ACE.Database/Models/World, 56 files);
#       world SQL v0.9.295, SHA256 98caa038a27d2620bc4b644e62150aa4eec7754251c6313aaa959c3b11f784a8.
# Sources: docs/pack-format.md (namespace table, lines ~95-135), docs/content-inbox.md (lines 25-30, 76-87),
#   crates/content/bace-{content,content-tools,import}/README.md, crates/content/bace-content/src/world_record.rs
#   (namespace() 16-45), crates/content/bace-content-tools/src/world_pack.rs (namespaces 1,2,3,48,49,52),
#   crates/content/bace-content-tools/src/loot_tables.rs (46,47), creature_name_validation.rs (48,49).
# Import counts are from the accepted pack's import report: .local/world-packs-current/import-report.toml.
#
# status: end_to_end = data reaches a gameplay consumer that uses it; partial = reaches runtime but the consumer
#   does not execute the full gameplay; prepared_only = loaded and validated, no gameplay reader; gap = not carried.
#
# Pack paths in use: server.toml pack_directory = .local/world-packs-current (accepted head is in PostgreSQL;
#   manifests there: fdb4...manifest revision 3 -> 7a27...bace; 9e13...manifest revision 1 -> 7a27...bace).

