# Blocker order, most impactful first (gameplay consequence in parentheses):
# 1. NPC talk and emotes: emote + emote_action are partial (bace-emotes program prepared; interpreter incomplete);
#    event_filter prepared_only (no reader). Blocks NPC greetings, Talk, and authored emote sequences.
# 2. Quests: quest prepared_only (4237 rows; only bace-quests eligibility). Blocks quest turn-ins, quest chests and quest-gated emotes.
# 3. Crafting: recipe family end_to_end, cook_book prepared_only (44755 rows never read). Blocks ingredient-pair cookbook lookup.
# 4. Books: book + book_page_data prepared_only (no reader; no BookData encoder). Blocks Book Use and authored text.
# 5. Houses: house_portal prepared_only (861 rows); house data in housing scaffolded. Blocks house portals and slumlord content.
# 6. Spells: spell partial (6266 rows used for enchantments/generators; casting missing). Blocks spell Use, scrolls, switches.
# 7. World events: event prepared_only (700 rows). Blocks scheduled events.
# 8. Points of interest, version: prepared_only, low impact.
# 9. Patches (clothing 50, animation swap 51): prepared_only; live publication rejects animation swaps.
#
# Gaps not in the ACE world table set but needed by the pinned pipeline: none found.
