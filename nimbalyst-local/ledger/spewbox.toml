# BetterACE chat-window ("spewbox") coverage ledger. Read-only P0-D inventory.
# ACE source of truth: pinned commit below (ACE owns wire layout per docs/baselines.toml).
# BACE paths are repo-relative. "path:line" names the opcode/variant line, encoder or projector
# call site found in the working tree. An empty string means none was found.
# Opcode values were checked against ACE GameEventType.cs / GameMessageOpcode.cs and BACE
# opcode_event.rs / opcode_message.rs. Field order was compared by reading both sides.
# No golden or differential test is cited here. Passing these rows is not ACE parity evidence.

[meta]
ace_commit = "47edade3bd3f6044b676d4eb877c4965c7eda62b"
ace_absent_names = ["GameEventTransientString", "GameEventDisplayStatusMessage", "GameMessageServerMessage"]
ace_absent_note = "git grep at the pin finds 0 matches for these names. The ServerMessage opcode (0xF7E0) carries GameMessageSystemChat. CommunicationTransientString is the only transient-string event."
bace_error_codes = "BACE has no WeenieError or WeenieErrorWithString enum. Codes are raw u32 literals (for example 0x3E, 0x4A) at the call sites listed below."
bace_chat_types = "BACE has no ChatMessageType enum. chat_type is a raw u32 literal (for example 2 Speech, 3 Tell, 7 System)."

# ---------------------------------------------------------------------------
# Part 1: chat-window message types
# ---------------------------------------------------------------------------

[[messages]]
name = "GameMessageSystemChat"
opcode = "0xF7E0"
kind = "game_message"
bace_encoder = "crates/network/bace-wire/src/chat.rs:39"
bace_projector = "crates/network/bace-replication/src/social_actions.rs:170"
ace_source = "Source/ACE.Server/Network/GameMessages/Messages/GameMessageSystemChat.cs"
notes = "ACE writes GameMessageOpcode.ServerMessage (0xF7E0). Payload string16 + int32 chat type matches chat.rs:47-49. Other ChatMessage::System projectors: social_actions.rs:49 (depleted notice, chat_type 7), crafting_proficiency.rs:171, training_notice.rs:80, inventory.rs:442, item_experience.rs:56, enchantment_expiry.rs:23, experience.rs:136 and 164, staff_magic.rs:76, progression.rs:100, staff.rs:17/51/154 (all under crates/network/bace-replication/src). ACE call-site counts are in the emitters table."

