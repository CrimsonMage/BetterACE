# P0-L client gameplay rules that imply server behaviour (read-only).
# Client source: /home/jokerfactor/Documents/acclient-source-split/ (paths below are relative to that root).
# Manifests used: INDEX/manifests/10_character_gameplay_systems.json, 09_client_core_systems.json (via INDEX/TINY_AI_SCOPE_GUIDE.md).
# ACE pin: 47edade3bd3f6044b676d4eb877c4965c7eda62b (.reference/ACE-.../Source/ACE.Server).
# BACE refs are crates/... relative to the BACE repo root.
# bace_status: met = BACE emits or validates what the client needs; unmet = absent or ignored; unknown = not verified in this pass.
# Priority: high = a missing reply hangs the client (busy cursor, prevRequest lock, or a window that never closes).

[meta]
busy_count_rule = "ClientUISystem::IncrementBusyCount is called on every Use, UseWithTarget, cast, attack, shop event and teleport start. m_cBusy is reset only at ClientUISystem.cpp:605 and :799, and nothing times it out. Only UseDone (0x01C7, CM_Item.cpp:34 / ClientUISystem.cpp:666), HandleAttackDoneEvent (ClientCombatSystem.cpp:1863), a vendor response or the teleport end decrements it. A missing reply leaves the cursor busy until relog."
inventory_lock_rule = "ACCWeenieObject.cpp:1560-1576 refuses every move/put/drop while prevRequest != 0. It is released only by a reply for the same object id: ServerSaysMoveItem (:1942-1946), ServerSaysSetStackSize (:1345-1349), RecordResponse (:1224-1230) or ServerSaysAttemptFailed (:2711-2715). prevRequestTime is written but never read, so there is no timeout."
window_rule = "Book pages, the trade window, the vendor window and the ground-container window each stay open on the client until the server or the client closes them. No client-side timeout closes them."

# ---------------------------------------------------------------------------
# Use / busy-lock family
# ---------------------------------------------------------------------------

[[client_rule]]
system = "use"
client_file = "ItemHolder.cpp"
client_function = "ItemHolder::UseObject (ItemHolder.cpp:1344-1500, busy increment at :1493)"
rule = "Every useable item (world or inventory) sends Event_UseEvent and increments busy. The cursor stays busy until UseDone arrives."
server_expectation = "Exactly one UseDone (0x01C7, code 0 on success, WeenieError otherwise) for every Use request, including refusals and unhandled object classes."
bace_status = "unmet"
bace_ref = "crates/application/bace-runtime/src/game_runtime/ingress.rs:754"
ace_ref = "Source/ACE.Server/WorldObjects/Player_Use.cs:176-200, 236-238 (TryUseItem queues SendUseDoneEvent after OnActivate; line 249 defines it)"
priority = "high"
notes = "ingress.rs:754 warns and ignores any Use outside the handled classes (see ACE WorldObjects ActOnUse list in action-coverage). No UseDone is produced, so the busy count stays up."

[[client_rule]]
system = "use"
client_file = "CPlayerSystem.cpp"
client_function = "CPlayerSystem::UsingItem (CPlayerSystem.cpp:4058-4120)"
rule = "After a Use the client opens owned containers locally and only asks the server for ground containers. For non-owned containers it sets requestedGroundObject and waits for ViewContents."
server_expectation = "For each container Use: ViewContents (0x0196) for the requested id, then UseDone. Owned containers need a UseDone, ground containers need ViewContents matching requestedGroundObject."
bace_status = "unmet"
bace_ref = "crates/application/bace-runtime/src/inventory_service/output.rs:163"
ace_ref = "Source/ACE.Server/WorldObjects/Container.cs:695 (Container.ActOnUse); Player_Use.cs:236-238"
priority = "high"
notes = "ViewContents is emitted only for NPC inventory and corpse access (game_runtime/npc/inventory_output.rs, deaths/access/output.rs:264-269). Generic containers and chests have no producer."

