# ---------------------------------------------------------------------------
# Plan summary
# ---------------------------------------------------------------------------

[summary]
cards_per_family = { Container = 5, Food = 5, Chest = 4, "Lock/Key" = 6, Lockpick = 5 }
shared_cards = 6
total_cards = 31
coordinator_owned_shared = ["S1 (ingress.rs WIP)", "S2 (corpse output WIP; UseDone seam)", "S5 (durable world property change; persistence contract)", "S6 (bace-gameplay-api contracts)"]
gdle_authority_cards = ["H1 (lock state window)", "H3 (reset interval)", "K1 (key match)", "K6 (door lock, gdle door authority)", "L1 (pick chance: ace default, gdle oracle)"]

# Land order: shared first, then the simplest family first (Container reads, no durable state), then Food (durable item and vital),
# then lock state (needs S5), then Lockpick (needs lock state, chance formula and dice).
implementation_order = [
  "S4 (use reach helper, clean corpse file)",
  "S1 + S2 + S3 (dispatch seam, UseDone seam, NoLongerViewing handler) after the WIP owners land",
  "S6 (gameplay-api Use types) before any runtime route card",
  "C2 (container source read), C1 (state machine), C3 (route and ViewContents), C4 (close), C5 (tests)",
  "F1 + F2 (gate and pure arithmetic in parallel), F3 (outbound), F4 (durable route), F5 (spell food stays Unsupported until magic)",
  "K1 + K3 (pure key match and unlocker charge), S5 decision then H2 (durable lock state), H1 (gate), H3 (reset), H4 (chest route)",
  "K2 (key route), K4 (unlock receipt), K5 (error codes), K6 (door key, after door authority)",
  "L1 + L2 (pure chance and trained gate), L3 (pick attempt), L4 (proficiency), L5 (real UDP)",
]

# Findings to verify before implementation (not blockers for the cards above):
#  1. deaths/access/output.rs:41-70 maps OutOfRange to 0x3D YouChargedTooFar. ACE does not send 0x3D for container reach
#     (it moves the player). Verify before reusing the mapping in C3.
#  2. Corpse Open/Close output emits no UseDone. ACE TryUseItem emits UseDone(0) after every activation (Player_Use.cs:223-240).
#     Covered by S2.
#  3. Chest reset interval disagreement: ACE 120 s vs GDLE 600 s (key) and 300 s (lockpick quest chest). Owner decision (H3).
#  4. Reach: ACE default UseRadius 0.5 (after move) vs GDLE 1.0 use distance (Key.cpp:15-25). ACE is default; record.
#  5. Magic key string '_bohemund's_magic_key_' exists in ACE only (Lock.cs:260-268). Owner decision (K1).
#  6. Lockpick proficiency: ACE awards on success; no GDLE twin found in the success branch. Verify (L4).
