# Pins and sources:
#   ACE:  .reference/ACE-47edade3bd3f6044b676d4eb877c4965c7eda62b/Source/...  (paths below are relative to that snapshot)
#   GDLE: /home/jokerfactor/Documents/GitHub/gdlenhanced @ 353cbab  (paths below are relative to its Source/)
#   Authority (docs/baselines.toml): lock/door STATE = gdle (coordinator instruction); food, container range and
#   wire layout = ace (gameplay_default). Where they disagree the card records both and names the chosen source.
