# P0-F client inbound gap ledger (read-only pass over the retail client decompile).
#
# Scope: every server->client GameEvent (0xF7B0 sub-op) and top-level GameMessage that the
# retail client HANDLES, with whether BACE and pinned ACE can emit it.
#
# Client sources: /home/jokerfactor/Documents/acclient-source-split/ (client_file is relative to it).
#   Dispatchers: UIQueueManager.cpp ProcessNetBlobData (sub-op switch and top-level 0xF630/0xF7xx),
#   ACSmartBox.cpp (top-level 0xF619/0xF745-0xF7DB), CLCache.cpp (DDD inbound), Client.cpp (TurbineChat).
#   Entries marked "inline case" are handled inside a dispatcher rather than a named CM_* function.
#
# ACE (pin 47edade3bd3f6044b676d4eb877c4965c7eda62b):
#   ace_emits = true only when the value is defined in GameEventType.cs or GameMessageOpcode.cs AND a
#   non-enum Source file references the name (an emitter). Enum-only definitions are false.
#
# BACE: bace_emits = true only when a non-input encoder/projector in crates/network/bace-wire/src or
#   crates/network/bace-replication/src constructs the opcode (match-arm output mapping or message_writer).
#   An opcode constant without such an encoder is false. The path:line is the first emitting line found.
#
# Corrections to the task-card example:
#   - DispatchUI_TextboxString is NOT 0x02EB. The client dispatches it from the top-level 0xF7E0
#     (ServerMessage) case; 0x02EB is CM_Communication::DispatchUI_TransientString.
#   - ProcessNetBlobData handles both GameEvent-wrapped sub-ops and some top-level GameMessage ids
#     (0x0024, 0x0197, 0x019E, 0x02BB, ...). Kind is taken from the ACE enum that defines the value.
#
# Known client non-handlers (not listed): opcode 0x00B5 BookModifyPageResponse has no case;
#   0xF7E8 DDD_BeginPullDDD and 0xF7E9 DDD_IterationData have no inbound case in CLCache.cpp.
#
# Out of scope for this ledger (client->server only, not CM_* Event_* senders):
#   0xF6EA ForceObjectDescSend, 0xF7C8 CharacterEnterWorldRequest, 0xF7CC GetServerVersion,
#   0xF7CD FriendsOld, 0xF7D9 CharacterRestore (Proto_UI.cpp); 0xF7E3 DDD_RequestDataMessage and
#   0xF7E6 DDD_InterrogationResponse (CLCache.cpp); 0xF7B1 GameAction wrapper (OrderHdr.cpp);
#   0xF7DE TurbineChat outbound (CChatEvent.cpp).
#
# Client->server action check: all 157 CM_*::Event_* senders write opcodes that exist in ACE's
#   GameActionType.cs at the pin (movement senders 0xF61B/0xF61C/0xF61E/0xF649/0xF661/0xF752/0xF753/0xF7C9
#   are present there too). Therefore no [[client_actions_not_in_ace]] entries exist.

