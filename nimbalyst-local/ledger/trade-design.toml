# ---------------------------------------------------------------------------
# GDLE comparison (TradeManager.cpp), for disagreements only
# ---------------------------------------------------------------------------

[[gdle_comparison]]
topic = "Equipped items"
ace = "Equipped items are tradeable: TryDequipObjectWithNetworking at Player_Trade.cs:239,249."
gdle = "TradeManager.cpp:134-190 refuses IsWielded or IsAttunedOrContainsAttuned items at accept time, with 'You cannot trade X!' text."
decision = "Follow ACE (authority). Record as disagreement."

[[gdle_comparison]]
topic = "Distance enforcement during trade"
ace = "Checked only at open (CreateMoveToChain). No periodic check."
gdle = "TradeManager.cpp:322-334 CheckDistance closes both with reason 1 when DistanceTo >= 1."
decision = "Open. Hardening candidate under AUTH-04 with valid-client and invalid-input tests; needs main approval."

[[gdle_comparison]]
topic = "Failure at accept time"
ace = "Decline-style failures (missing item, capacity, busy) clear acceptance and keep the trade open."
gdle = "TradeManager.cpp:232 CloseTrade(initiator, 0) closes both on any failed accept."
decision = "Follow ACE for the default flow. Record."

[[gdle_comparison]]
topic = "Success"
ace = "TradeComplete, reset windows, trade stays open (ResetTrade)."
gdle = "TradeManager.cpp:215-226 TradeComplete, ResetTrade, keeps the trade open."
decision = "Agree."

# ---------------------------------------------------------------------------
# Divergences and open decisions
# ---------------------------------------------------------------------------

[[divergences]]
id = "D1"
topic = "CloseTrade reason"
ace = "Reason 1 (Normal) on client close, partner logout, and reason 2 on combat switch (EndTradeReason.cs:5-6)."
retail = "docs/divergences.toml id 23: retail client closes with reason 1105 (0x0451, the TradeClosed WeenieError value) in 211 of 211 samples. Source status UNVERIFIED."
decision = "Keep ACE values until a capture is verified. Do not claim retail parity (AUTH-04). Owner: main (docs)."

[[divergences]]
id = "D2"
topic = "Persistence of completed trade"
ace = "In-memory swap first, SaveBiotasInParallel without awaiting, crash loses items (Player_Trade.cs:270-282)."
decision = "BACE deviation, mandatory: success only after the PostgreSQL commit returns Committed or AlreadyCommitted (SAVE-02, vendor Buy pattern). Document as a hardening deviation with a crash-window test (AUTH-04)."

[[divergences]]
id = "D3"
topic = "Window size"
ace = "No cap; ItemsInTradeWindow is an unbounded HashSet. Slot argument ignored."
