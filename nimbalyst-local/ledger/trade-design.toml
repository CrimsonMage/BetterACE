# ---------------------------------------------------------------------------
# Durability rules that every card must honour
# ---------------------------------------------------------------------------

[durability]
rule = "Trade success is reported only after the atomic PostgreSQL commit returns Committed or AlreadyCommitted for a durable operation id (SAVE-02)."
receipt_pattern = "Reuse the vendor Buy pattern: PlacementOperation with participants and leases, durable_operations fingerprint, AlreadyCommitted on replay, same operation_id on retry (vendors/buy.rs:394-430, buy_freezing.rs:300)."
uncertain_outcome = "Retry with the identical operation (same id and fingerprint). Never mint a new id for the same transfer."
logout = "A logout while Saving waits for the outcome. A logout before Save cancels the reservation and closes both sides (S10)."
no_duplicate_transfer = "Items are removed only by the committed operation. Window items stay locked until commit or close (S11, D7)."

[validation]
commands = [
  "cargo test -p bace-wire trade",
  "cargo test -p bace-session trade",
  "cargo test -p bace-economy trade",
  "cargo test -p bace-simulation trade",
  "cargo test -p bace-inventory trade_transfer",
  "cargo test -p bace-db-postgres trade_placement (PostgreSQL required)",
  "cargo test -p bace-runtime trade (filtered only)",
]
note = "Per worker rules: crate-scoped tests only; rustfmt --edition 2024 on the files edited, never cargo fmt."
