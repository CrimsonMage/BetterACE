# P0-H player-to-player trade design (read-only). No crate or docs edits were made.
# ACE pin: 47edade3bd3f6044b676d4eb877c4965c7eda62b, read from .reference/ACE-47edade3bd3f6044b676d4eb877c4965c7eda62b/Source.
# GDLE pin: gdlenhanced 353cbab (TradeManager.cpp). Authority: ACE owns default gameplay; trade is not in the GDLE-owned list (docs/baselines.toml authority_policy).
# Owner of trade logic: bace-economy (ARCHITECTURE.md:50 'Vendors, currency and player trades'; architecture.toml bace-economy).

[meta]
ace_player_trade = ".reference/ACE-47edade3bd3f6044b676d4eb877c4965c7eda62b/Source/ACE.Server/WorldObjects/Player_Trade.cs"
ace_handlers_dir = ".reference/ACE-47edade3bd3f6044b676d4eb877c4965c7eda62b/Source/ACE.Server/Network/GameAction/Actions"
gdle_trade = "gdlenhanced/Source/TradeManager.cpp"
gap_summary = "No player trade exists in BACE: no simulation owner, no runtime phase machine, no output producer. Decoders and outbound encoders exist but are unused, and inventory.rs excludes trade opcodes (docs/action-coverage.toml rows 0x01F6-0x0204 decoded-closed). docs/gameplay-parity.toml economy.remaining = Player trade negotiation and commit."

# ---------------------------------------------------------------------------
# 1) ACE flow
# ---------------------------------------------------------------------------

[[ace_steps]]
id = "S1-open"
gameaction = "OpenTradeNegotiations 0x01F6 (u32 partner guid)"
ace_refs = ["GameActionOpenTradeNegotiations.cs:8-13", "Player_Trade.cs:30-100"]
preconditions = "Olthoi cannot trade (chat only, no WeenieError). Initiator checks: partner is not Olthoi; partner IgnoreAllTradeRequests option; neither IsTrading; both CombatMode NonCombat."
state_before = "both Idle (IsTrading=false)"
action = "Initiator runs CreateMoveToChain to partner (async). On move success, sends RegisterTrade to initiator and calls partner.HandleActionOpenTradeNegotiations(initiator,false)."
state_after = "both IsTrading=true, TradePartner set both ways, ItemsInTradeWindow cleared both, TradeTransferInProgress=false both"
events = ["RegisterTrade 0x01FD to initiator: (initiator guid, partner guid, u64 0) at Player_Trade.cs:80", "RegisterTrade 0x01FD to partner: (partner guid, partner guid, u64 0) at Player_Trade.cs:98"]
weenie_errors = ["0x044C TradeIgnoringRequests (initiator only, line 51)", "0x044F TradeAlreadyTrading (either party, line 58)", "0x0455 TradeNonCombatMode (either party, line 65)", "0x044E TradeMaxDistanceExceeded (initiator, async move failure, line 76)"]
note = "ACE quirk: the distance/move callback re-enters the partner branch without re-running the busy and combat checks. Initiator copy and partner copy use different guid pairs."

[[ace_steps]]
id = "S2-add"
gameaction = "AddToTrade 0x01F8 (u32 item guid, u32 window slot)"
ace_refs = ["GameActionAddToTrade.cs:7-13", "Player_Trade.cs:116-175"]
preconditions = "TradeTransferInProgress false. TradePartner resolves to an online player and item guid nonzero. Item found in main pack or side packs (Container.cs:245-275) or equipped."
state_before = "both IsTrading; both TradeAccepted may be set"
action = "Clears own TradeAccepted and partner TradeAccepted. Adds item guid to own ItemsInTradeWindow (slot value is ignored). Registers known-trade-object tracking for partner and tracks the object."
state_after = "window contains item; both acceptance flags false"
events = ["AddToTrade 0x0200 to self: (item, side 1 Self, 0) at line 163", "AddToTrade 0x0200 to partner: (item, side 2 Partner, 0) after 0.001 s delay at line 172"]
failures = ["Attuned or contains attuned: chat 'You cannot trade that!' + TradeFailure 0x0207 (item, 0x0426 AttunedItem), lines 142-143", "Pet device with active pet: chat 'You must unsummon your pet before you can trade this item!' + TradeFailure (item, 0x0426), lines 149-150", "Unique item the partner cannot carry: TradeFailure (item, 0x0000 None), line 157", "Item not found or no partner: silent return, lines 121-137"]
note = "ACE does not check duplicate adds (HashSet dedupes but still emits the event), has no window cap, and ignores the slot argument."

[[ace_steps]]
id = "S3-reset"
gameaction = "ResetTrade 0x0204"
ace_refs = ["GameActionResetTrade.cs:8-20", "Player_Trade.cs:177-186"]
preconditions = "TradeTransferInProgress false (per player)."
state_before = "both negotiating"
action = "Both players clear own window and TradeAccepted. Requester guid is passed as whoReset to both."
state_after = "both windows empty, acceptance false, still IsTrading"
events = ["ResetTrade 0x0205 (who=requester guid) to both sides"]
weenie_errors = []

[[ace_steps]]
id = "S4-clear-acceptance"
ace_refs = ["Player_Trade.cs:188-194"]
action = "Helper for busy and inventory-verification failures. Clears window and acceptance for one player."
events = ["ClearTradeAcceptance 0x0208 (empty payload)"]
note = "Called on both sides by the busy and capacity checks in S7."

[[ace_steps]]
id = "S5-accept"
gameaction = "AcceptTrade 0x01FA (ACE reads partner u32, stamp f64, status u32, initiator u32, two u32 flags; ALL ignored)"
ace_refs = ["GameActionAcceptTrade.cs:9-19", "Player_Trade.cs:196-216"]
preconditions = "TradeTransferInProgress false."
state_before = "negotiating"
action = "Sets own TradeAccepted=true. If partner is online, sends accept to both and then calls FinalizeTrade when partner.TradeAccepted is already true."
state_after = "own accepted; finalize when both accepted"
events = ["AcceptTrade 0x0202 (who=self guid) to self", "CommunicationTransientString 'You have accepted the offer' to self", "AcceptTrade 0x0202 (who=self guid) to partner", "CommunicationTransientString '<Name> has accepted the offer' to partner"]
note = "Client payload flags never influence acceptance. BACE must derive acceptance server-side (AUTH-01). The decoder in bace-wire already reads all six fields with the same layout (inventory_input.rs:166-173, ACE reads f64 at GameActionAcceptTrade.cs:12)."

[[ace_steps]]
id = "S6-decline"
gameaction = "DeclineTrade 0x01FB"
ace_refs = ["GameActionDeclineTrade.cs:7-10", "Player_Trade.cs:307-323"]
preconditions = "TradeTransferInProgress false."
state_before = "negotiating"
action = "Clears own TradeAccepted only. Does not close the trade and does not clear the partner acceptance."
state_after = "still negotiating; caller not accepted"
events = ["DeclineTrade 0x0203 (who=decliner guid) to both", "CommunicationTransientString 'Trade confirmation failed...' to both"]
note = "ACE quirk: the partner TradeAccepted flag is left set after a decline. Decision needed (see divergences)."

[[ace_steps]]
id = "S7-finalize"
ace_refs = ["Player_Trade.cs:218-283 FinalizeTrade", "Player_Trade.cs:342-360 VerifyTrade_BusyState", "Player_Trade.cs:362-425 VerifyTrade_Inventory", "Player_Trade.cs:285-305 GetItemsInTradeWindow"]
trigger = "S5 when both TradeAccepted are true."
checks = ["Busy: if either IsBusy, send 'too busy' chat to each side and ClearTradeAcceptance both, return.", "Window resolution: every window item must still be in main/side packs or equipped; else the owner of the missing item runs S6 decline and returns.", "Capacity: CanAddToInventory for each side's incoming items. Failure sends encumbered or no-free-slot chat to each side, ClearTradeAcceptance both, returns."]
action_on_pass = "Sets IsBusy and TradeTransferInProgress on both. Chat 'The items are being traded' to both. Removes every window item from its owner (TryRemoveFromInventoryWithNetworking or TryDequipObjectWithNetworking, reason TradeItem). Schedules a 0.5 s chain on CurrentLandblock."
deferred_chain = ["Create swapped items in the new owner inventories (TryCreateInInventoryWithNetworking).", "WeenieError 0x0529 TradeComplete to both.", "Clear TradeTransferInProgress and IsBusy on both.", "DatabaseManager.Shard.SaveBiotasInParallel(tradedItems, null): fire-and-forget, result not awaited.", "HandleActionResetTrade(own guid) on both (S3 events)."]
state_after = "IsTrading remains true; windows empty; acceptance false. Trade window stays open until a client close."
events = ["CommunicationTransientString 'The items are being traded' x2", "inventory remove/create events (existing inventory output family)", "WeenieError 0x0529 TradeComplete x2 (GameEventWeenieError 0x028A)", "ResetTrade 0x0205 x2"]
note = "ACE persistence is not atomic with the in-memory swap: items leave both inventories before any durable write and a crash in the 0.5 s window loses items. BACE must not copy this (SAVE-02, AUTH-04 deviation with tests)."

[[ace_steps]]
id = "S8-close"
gameaction = "CloseTradeNegotiations 0x01F7"
ace_refs = ["GameActionCloseTradeNegotiations.cs:8-19", "Player_Trade.cs:102-114"]
preconditions = "Partner resolved online. Per player: returns early when TradeTransferInProgress."
state_before = "negotiating (or completed, window open)"
action = "Calls close on the initiator then on the partner. Each clears IsTrading, TradeAccepted, TradeTransferInProgress, window and TradePartner."
state_after = "both Idle"
events = ["CloseTrade 0x01FF (reason u32 1 Normal) to each side", "WeenieError 0x0451 TradeClosed to each side"]
note = "Reason value 1 is ACE EndTradeReason.Normal (ACE.Entity/Enum/EndTradeReason.cs:5). Retail observation disagrees (see divergences D1)."

[[ace_steps]]
id = "S9-combat-switch"
ace_refs = ["Player_Trade.cs:325-340 HandleActionTradeSwitchToCombatMode", "Creature_Combat.cs:175,200,245 callers"]
trigger = "A trading player becomes non-NonCombat (creature attack paths in Creature_Combat.cs)."
action = "Both sides: WeenieError 0x0455 TradeNonCombatMode, then close with reason 2 EnteredCombat."
events = ["WeenieError 0x0455 x2", "CloseTrade 0x01FF (reason 2) x2", "WeenieError 0x0451 x2 (from close)"]

[[ace_steps]]
id = "S10-logout"
ace_refs = ["Player.cs:536-541"]
trigger = "A trading player logs out (Player logout path)."
action = "Partner runs HandleActionCloseTradeNegotiations() with default reason Normal. The logging-out side is not sent a close by this path."
events = ["CloseTrade 0x01FF (reason 1) to partner", "WeenieError 0x0451 to partner"]
note = "Matches divergence 23 shard report (reason 0x1 at partner logout)."

[[ace_steps]]
id = "S11-restrictions"
ace_refs = ["Player_Commerce.cs:31,282", "Player_Inventory.cs:600,860,1402,2320,2528", "Player_Use.cs:122,188", "Player_Crafting.cs:165", "Player_House.cs:256,275,766"]
action = "While IsTrading, sell, use, drop, craft and housing moves refuse items that are in the trade window or contain one (IsBeingTradedOrContainsItemBeingTraded). The item is not moved."
note = "Required invariant for BACE: a window item must be locked against other owners (vendor sell, craft, use, drop) until S7 completes or S8 closes."

# Source-derived GameEvent sends per step are listed above. Opcodes come from ACE GameEventType.cs:52-61, WeenieError from WeenieError.cs.

# ---------------------------------------------------------------------------
# State machine (per player, as in ACE Player fields)
# ---------------------------------------------------------------------------

[state_machine]
per_player_fields = ["IsTrading", "TradePartner", "ItemsInTradeWindow (HashSet, unbounded in ACE)", "TradeAccepted", "TradeTransferInProgress", "IsBusy (shared with other busy activities)"]
states = ["Idle", "Negotiating(both IsTrading, window editable)", "Transferring(TradeTransferInProgress on both, items removed, deferred create pending)", "Completed(window open, empty, IsTrading still true)"]
transitions = [
  "Idle -OpenTrade ok-> Negotiating",
  "Negotiating -AddToTrade-> Negotiating (acceptance cleared both)",
  "Negotiating -ResetTrade-> Negotiating (window cleared both)",
  "Negotiating -DeclineTrade-> Negotiating (only decliner acceptance cleared)",
  "Negotiating -AcceptTrade (one side)-> Negotiating (one accepted)",
  "Negotiating -AcceptTrade (both accepted) and verify ok-> Transferring",
  "Negotiating -AcceptTrade (both accepted) and verify fails-> Negotiating (acceptance cleared both)",
  "Transferring -0.5 s chain-> Completed (TradeComplete both)",
  "Completed -AddToTrade or ResetTrade-> Negotiating",
  "Negotiating|Completed -CloseTrade (either side, logout, combat switch)-> Idle",
]
invariants = ["Transfer is never started while either side is busy or any window item is missing.", "A window item must be moved by exactly one transfer.", "Close is refused while TradeTransferInProgress (ACE returns early); BACE must instead keep the trade in Transferring until the durable outcome is known (SAVE-02)."]

