# Suggested implementation order (cheapest and most used first). Tiers after 4 need magic, content or physics.
[summary]
handled = 12
missing = 24
total_override_classes = 36
# Blocked by magic: Scroll (spell learning), Switch (spell cast). Food spell payloads also wait on magic. Blocked by content: Book (authored pages), Hook, Hooker, Storage, HousePortal, SlumLord (house content),
#   AdvocateFane (fane content), Game (chess content), Creature and Cow (authored emote scripts).
# Blocked by physics: PressurePlate (collision activation). Blocked by quests/crafting: Gem contracts and tailoring.
implementation_order = [
  "1 Container: ordinary world-container Open/Close (inventory and visibility; most used, no magic or content)",
  "2 Food: consume, vital boosters (character vitals and inventory; spell payloads wait on magic)",
  "3 Chest: container Use after lock check (depends on 1)",
  "4 Lockpick and Key: unlock helper and lock state (depends on 3; skill checks)",
  "5 Book: BookDataResponse encoder and authored page data (content-blocked for authored books)",
  "6 Scroll: spell learning (blocked by magic)",
  "7 Switch: spell cast on Use (blocked by magic)",
  "8 Gem: contracts and tailoring kits (blocked by quests and crafting)",
  "9 Housing group: Hook, Hooker, Storage, HousePortal, SlumLord (blocked by housing and house content)",
  "10 Creature and Cow emote activation, GenericObject sound (blocked by emote content)",
  "11 PressurePlate (blocked by authoritative collision)",
  "12 PKModifier, AdvocateFane, Game, and no-op classes LightSource, Stackable, Ammunition (low value)",
]
