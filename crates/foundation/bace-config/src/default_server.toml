# BetterACE server configuration. Generated on the first run only.
# Edit this file before serving a game client. Existing files are never replaced.

# The game listens here and uses the next UDP port for the ACE companion port.
bind_address = "127.0.0.1:9000"

# Name shown to game clients during login (1-128 printable ASCII characters).
world_name = "BetterACE"

# A nonempty PostgreSQL URL in this environment variable takes precedence.
database_url_env = "BACE_DATABASE_URL"

# On Unix, `cargo run -p bace-cli -- local-database` provisions a private
# passwordless local database and prints its exact socket URL. Paste that URL
# below if you prefer a local setting; do not commit a credential-bearing URL.
# database_url = "postgresql:///betterace?host=<absolute-private-socket-directory>&user=betterace"

# Conventional local paths. These names alone do not provision DAT assets,
# an accepted world pack, or the private RNG key required for game readiness.
dat_directory = "data/dats"
pack_directory = ".local/world-packs"
random_key_file = "state/random-key"

# Native TOML staged here is reviewed by the host; it is not imported on startup.
content_inbox_directory = "state/content-inbox"

# Defaults match the bounded server settings. See crates/foundation/bace-config/README.md for
# optional [host], [network], [accounts], [world], and chat sections.
command_capacity = 4096
max_sessions = 512
database_connections = 4

# Set true only to patch clients with older DATs. Startup scans the approved
# Portal/Language archives to prepare transfer metadata and can take minutes.
[dat_distribution]
enabled = false
